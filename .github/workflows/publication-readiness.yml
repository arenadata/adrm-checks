# Reusable workflow called by a project's wrapper (examples/release-readiness.yml); runs with the caller's
# GITHUB_TOKEN, repository and workflow SHA.
# mode=check (default): `emit` against .readiness/publication.yaml at the caller's workflow revision; result.json.
# mode=inspect: `line` on the head of the dispatched line branch; line.json with the declared project version.
# mode=dependencies: the dependency graph of the branch head from the build (Maven dependency:tree in JSON per
#   module, a Gradle init-script task over the resolution result; nothing is compiled or published), one container
#   per invocation, with the build_* values of the wrapper; dependencies.json.
# mode=history: the commits of the predecessor branches in compare_refs that the branch head lacks (full clone,
#   upstream release tags as the boundary; nothing is built or written to refs); lost-commits.json.
name: Publication readiness (reusable)

on:
  workflow_call:
    inputs:
      mode: { type: string, required: false, default: check }
      request_id: { type: string, required: true }
      generation: { type: string, required: true }
      product_version: { type: string, required: true }
      expected_checker_sha: { type: string, required: true }
      target_tag: { type: string, required: false, default: '' }
      target_sha: { type: string, required: false, default: '' }
      target_version: { type: string, required: false, default: '' }
      line_version: { type: string, required: false, default: '' }
      expected_head_sha: { type: string, required: false, default: '' }
      manifest: { type: string, required: false, default: .readiness/publication.yaml }
      node-version: { type: string, required: false, default: '24' }
      # mode=dependencies: static values of the project, copied from its publisher workflow (see the wrapper example)
      build_tool: { type: string, required: false, default: '' }             # maven | gradle | sbt
      build_command: { type: string, required: false, default: '' }          # mvn | ./mvnw | ./build/mvn | ./gradlew
      build_args: { type: string, required: false, default: '' }             # one invocation per line: flags and profiles only
      java_version: { type: string, required: false, default: '' }           # major version: the eclipse-temurin:<java_version>-jdk image
      java_distribution: { type: string, required: false, default: temurin } # temurin only
      maven_server_ids: { type: string, required: false, default: arenadata } # ids resolved from GitHub Packages of the owner, comma-separated
      maven_mirrors: { type: string, required: false, default: '' }          # `<id> <https url>` per line: ids pinned to another registry, no credentials
      # mode=history: predecessor branches from ADRM, one `<branch>@<sha>` per line; static values of the project
      compare_refs: { type: string, required: false, default: '' }
      upstream_repository: { type: string, required: false, default: '' }  # owner/name; default: root of the fork network
      branch_local_paths: { type: string, required: false, default: '' }   # extra paths that differ between line branches by design

jobs:
  publication:
    if: inputs.mode == 'check'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the project manifest at the caller workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: project
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .readiness
      - name: Checkout adrm-checks at the called workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arenadata/adrm-checks
          ref: ${{ github.job_workflow_sha }}
          path: adrm-checks
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Check publication against the manifest
        if: always()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          GENERATION: ${{ inputs.generation }}
          TARGET_TAG: ${{ inputs.target_tag }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_VERSION: ${{ inputs.target_version }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
          EXPECTED_CHECKER_SHA: ${{ inputs.expected_checker_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ADRM_ENGINE_SHA: ${{ github.job_workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_TOKEN: ${{ github.token }}
          CHECKER_SETUP_STATUS: ${{ job.status }}
          RESULT_PATH: ${{ github.workspace }}/result.json
        run: node adrm-checks/src/publication-manifest.mjs emit --manifest "project/${{ inputs.manifest }}" --out "$RESULT_PATH"
      - name: Upload report including diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-readiness-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: result.json
          if-no-files-found: error
          retention-days: 7

  line:
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Cone-mode sparse checkout always includes the root files, so pom.xml, gradle.properties, version.txt,
      # build.gradle(.kts), version.sbt and build.sbt of the branch head are present without a full clone.
      - name: Checkout the line branch head (build files only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: project
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .readiness
      - name: Checkout adrm-checks at the called workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arenadata/adrm-checks
          ref: ${{ github.job_workflow_sha }}
          path: adrm-checks
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Report the declared project version of the branch head
        if: always()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          GENERATION: ${{ inputs.generation }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
          LINE_VERSION: ${{ inputs.line_version }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_CHECKER_SHA: ${{ inputs.expected_checker_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          CHECKER_SETUP_STATUS: ${{ job.status }}
          RESULT_PATH: ${{ github.workspace }}/line.json
        run: node adrm-checks/src/publication-manifest.mjs line --from project --out "$RESULT_PATH"
      - name: Upload line state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: line-state-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: line.json
          if-no-files-found: error
          retention-days: 7

  dependencies:
    if: inputs.mode == 'dependencies'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout the line branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: project
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout adrm-checks at the called workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arenadata/adrm-checks
          ref: ${{ github.job_workflow_sha }}
          path: adrm-checks
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      # Every invocation runs in a container of this image with the checkout, the build's home and the launcher
      # mounted (see the dependencies action). The JDK comes from the image; the home starts empty, so mavenLocal()
      # (first in Iceberg's repositories) cannot shadow the registries.
      - name: Choose the build container
        id: container
        if: inputs.build_tool == 'maven' || inputs.build_tool == 'gradle'
        env:
          JAVA_VERSION: ${{ inputs.java_version }}
          JAVA_DISTRIBUTION: ${{ inputs.java_distribution }}
        run: |
          set -euo pipefail
          [ "$JAVA_DISTRIBUTION" = temurin ] || { echo "::error::java_distribution must be temurin (the build runs in eclipse-temurin images): $JAVA_DISTRIBUTION"; exit 1; }
          [[ "$JAVA_VERSION" =~ ^[0-9]{1,3}$ ]] || { echo "::error::java_version must be a major version such as 8, 17 or 21: $JAVA_VERSION"; exit 1; }
          echo "image=eclipse-temurin:${JAVA_VERSION}-jdk" >> "$GITHUB_OUTPUT"
      # Every id of maven_server_ids gets the workflow token (GitHub Packages requires one even to read) and a mirror
      # of the same id to GitHub Packages of the repository owner, which covers every repository with that id in the
      # graph. maven_mirrors pins further ids to another registry, without credentials (for an id that names two hosts
      # across the modules). The file is passed to Maven as --global-settings, so it also works with a project's own
      # --settings in build_args.
      - name: Configure Maven servers
        if: inputs.build_tool == 'maven'
        env:
          SERVER_IDS: ${{ inputs.maven_server_ids }}
          MIRRORS: ${{ inputs.maven_mirrors }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$OWNER" =~ ^[A-Za-z0-9-]+$ ]] || { echo "::error::invalid repository owner: $OWNER"; exit 1; }
          servers='' mirrors='' pinned=''
          IFS=, read -ra ids <<< "$SERVER_IDS"
          for id in "${ids[@]}"; do
            id="${id// /}"
            [ -z "$id" ] && continue
            [[ "$id" =~ ^[A-Za-z0-9._-]+$ && "$id" != central ]] || { echo "::error::invalid Maven server id: $id"; exit 1; }
            servers+=$(printf '<server><id>%s</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>' "$id")
            mirrors+=$(printf '<mirror><id>%s</id><mirrorOf>%s</mirrorOf><url>https://maven.pkg.github.com/%s/*</url></mirror>' "$id" "$id" "$OWNER")
            pinned+="$id "
          done
          echo "Server ids with the workflow token, pinned to https://maven.pkg.github.com/$OWNER/*: ${pinned:-none}"
          anonymous=''
          while read -r id url rest; do
            [ -z "${id:-}" ] && continue
            [[ "$id" =~ ^[A-Za-z0-9._-]+$ && "$id" != central && -z "${rest:-}" ]] || { echo "::error::invalid maven_mirrors line: $id $url $rest"; exit 1; }
            [[ "${url:-}" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~*/-]*)?$ ]] || { echo "::error::invalid maven_mirrors URL for $id: ${url:-}"; exit 1; }
            [[ " $pinned$anonymous " != *" $id "* ]] || { echo "::error::Maven id $id is listed twice in maven_server_ids and maven_mirrors"; exit 1; }
            mirrors+=$(printf '<mirror><id>%s</id><mirrorOf>%s</mirrorOf><url>%s</url></mirror>' "$id" "$id" "$url")
            anonymous+="$id "
            echo "Id $id pinned to $url, without the token"
          done <<< "$MIRRORS"
          # Maven's own default, lost when the global settings are replaced: no repositories over plain HTTP.
          mirrors+='<mirror><id>maven-default-http-blocker</id><mirrorOf>external:http:*</mirrorOf><url>http://0.0.0.0/</url><blocked>true</blocked></mirror>'
          mkdir -p "$RUNNER_TEMP/adrm-maven"
          printf '<settings><servers>%s</servers><mirrors>%s</mirrors></settings>\n' "$servers" "$mirrors" > "$RUNNER_TEMP/adrm-maven/settings.xml"
      # A stale dispatch (the head or the wrapper moved) is reported by `report` as HEAD_CHANGED / CHECKER_CHANGED
      # without running the build.
      - name: Resolve the dependency graph from the build
        id: inventory
        if: inputs.expected_head_sha == github.sha && inputs.expected_checker_sha == github.workflow_sha
        uses: ./adrm-checks/actions/dependencies
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: ${{ inputs.build_tool }}
          command: ${{ inputs.build_command }}
          args: ${{ inputs.build_args }}
          from: project
          out: ${{ runner.temp }}/adrm-dependencies
          container: ${{ steps.container.outputs.image }}
          maven-settings: ${{ inputs.build_tool == 'maven' && format('{0}/adrm-maven/settings.xml', runner.temp) || '' }}
      - name: Report the dependency inventory
        if: always()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          GENERATION: ${{ inputs.generation }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
          LINE_VERSION: ${{ inputs.line_version }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_CHECKER_SHA: ${{ inputs.expected_checker_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          CHECKER_SETUP_STATUS: ${{ job.status }}
          BUILD_TOOL: ${{ inputs.build_tool }}
          RESULT_PATH: ${{ github.workspace }}/dependencies.json
        run: node adrm-checks/src/dependency-inventory.mjs report --inventory "${{ runner.temp }}/adrm-dependencies/inventory.json" --out "$RESULT_PATH"
      - name: Upload the dependency inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-inventory-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: dependencies.json
          if-no-files-found: error
          retention-days: 7

  history:
    if: inputs.mode == 'history'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The whole history of every branch: the predecessors arrive as refs/remotes/origin/<branch>.
      - name: Checkout the full history of the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: project
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout adrm-checks at the called workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: arenadata/adrm-checks
          ref: ${{ github.job_workflow_sha }}
          path: adrm-checks
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      # The upstream release tags bound the candidates: the wrapper's static upstream_repository, else the root of the
      # fork network (GitHub API `source`), else none.
      - name: Resolve the upstream repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository }}
        run: node adrm-checks/src/lost-commits.mjs upstream --repository "$GITHUB_REPOSITORY" --override "$UPSTREAM_REPOSITORY" --out "$RUNNER_TEMP/upstream.json"
      # A stale dispatch (the head or the wrapper moved) is reported by `report` as HEAD_CHANGED / CHECKER_CHANGED
      # without classifying anything.
      - name: Classify the commits of the predecessor branches
        if: inputs.expected_head_sha == github.sha && inputs.expected_checker_sha == github.workflow_sha
        env:
          COMPARE_REFS: ${{ inputs.compare_refs }}
          BRANCH_LOCAL_PATHS: ${{ inputs.branch_local_paths }}
        run: |
          set -euo pipefail
          printf '%s\n' "$COMPARE_REFS" > "$RUNNER_TEMP/compare-refs.txt"
          node adrm-checks/src/lost-commits.mjs classify --repo project --current "$GITHUB_REF_NAME@$GITHUB_SHA" \
            --sources-file "$RUNNER_TEMP/compare-refs.txt" --upstream-file "$RUNNER_TEMP/upstream.json" \
            --branch-local "$BRANCH_LOCAL_PATHS" --out "$RUNNER_TEMP/history.json"
      - name: Report the lost commits
        if: always()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          GENERATION: ${{ inputs.generation }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
          LINE_VERSION: ${{ inputs.line_version }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_CHECKER_SHA: ${{ inputs.expected_checker_sha }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          CHECKER_SETUP_STATUS: ${{ job.status }}
          COMPARE_REFS: ${{ inputs.compare_refs }}
          RESULT_PATH: ${{ github.workspace }}/lost-commits.json
        run: node adrm-checks/src/lost-commits.mjs report --history "$RUNNER_TEMP/history.json" --out "$RESULT_PATH"
      - name: Upload the lost commits report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lost-commits-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: lost-commits.json
          if-no-files-found: error
          retention-days: 7
