# Projects that run a license check (apache-rat in Apache forks): keep the project's own license header above this comment, copied from publish.yml.
# Regenerates .readiness/publication.yaml for a Gradle project (example: Iceberg): the publish invocations of
# publish.yml run with every PublishToMavenRepository task pointed at a file repository by the sandbox init script,
# which fails the build if a remote publish task remains. The `manifest` job builds and hands a changed manifest over
# as an artifact; the `pull-request` job opens the pull request.
name: Publication manifest
on:
  workflow_dispatch:
  pull_request:
    paths: ['**/*.gradle', 'gradle.properties', 'gradle/libs.versions.toml', '.github/workflows/publish.yml', '.readiness/publication.yaml']

permissions:
  contents: read

jobs:
  manifest:
    # The bot's own manifest pull request was just produced by this workflow: do not rebuild to re-check it.
    if: github.event_name != 'pull_request' || github.head_ref != 'readiness/publication-manifest'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    outputs:
      changed: ${{ steps.manifest.outputs.changed }}
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Redirect the publisher to a sandbox
        id: sandbox
        uses: arenadata/adrm-checks/actions/sandbox@<commit sha of adrm-checks>
        with:
          tool: gradle
      - name: Run the publisher exactly as publish.yml does
        run: |
          ./gradlew checkClassUniqueness --write-locks -x test -x integrationTest -DsparkVersions=3.5 -DflinkVersions= -Pquick
          ./gradlew build -x test -x integrationTest -DsparkVersions=3.5 -DflinkVersions= -Pquick
          ./gradlew -DallModules -PmavenUsername="${GITHUB_ACTOR}" -PmavenPassword="${GITHUB_TOKEN}" -PmavenUrl=https://maven.pkg.github.com/arenadata/iceberg publishApachePublicationToArenadataRepository --no-parallel --no-configuration-cache
          ./gradlew -DflinkVersions= -DsparkVersions=3.4 -DscalaVersion=2.13 -DkafkaVersions= -PmavenUsername="${GITHUB_ACTOR}" -PmavenPassword="${GITHUB_TOKEN}" -PmavenUrl=https://maven.pkg.github.com/arenadata/iceberg :iceberg-spark:iceberg-spark-3.4_2.13:publishApachePublicationToArenadataRepository :iceberg-spark:iceberg-spark-extensions-3.4_2.13:publishApachePublicationToArenadataRepository :iceberg-spark:iceberg-spark-runtime-3.4_2.13:publishApachePublicationToArenadataRepository --no-parallel --no-configuration-cache
          ./gradlew -DflinkVersions= -DsparkVersions=3.5 -DscalaVersion=2.13 -DkafkaVersions= -PmavenUsername="${GITHUB_ACTOR}" -PmavenPassword="${GITHUB_TOKEN}" -PmavenUrl=https://maven.pkg.github.com/arenadata/iceberg :iceberg-spark:iceberg-spark-3.5_2.13:publishApachePublicationToArenadataRepository :iceberg-spark:iceberg-spark-extensions-3.5_2.13:publishApachePublicationToArenadataRepository :iceberg-spark:iceberg-spark-runtime-3.5_2.13:publishApachePublicationToArenadataRepository --no-parallel --no-configuration-cache
      - name: Generate the manifest from the sandbox
        id: manifest
        uses: arenadata/adrm-checks/actions/manifest@<commit sha of adrm-checks>
        with:
          sandbox: ${{ steps.sandbox.outputs.dir }}/arenadata   # the publishing repository name from deploy.gradle
          invocations: '3'
      - name: Hand the manifest over to the pull-request job
        if: steps.manifest.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-manifest
          path: .readiness/publication.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Fail the pull request check when the manifest is stale
        if: steps.manifest.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          git --no-pager diff -- .readiness/publication.yaml
          echo "::error::.readiness/publication.yaml is stale; regenerate it (see adrm-checks README)"; exit 1

  pull-request:
    # Commits the manifest artifact of the `manifest` job and opens the pull request; builds nothing.
    needs: manifest
    if: needs.manifest.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publication-manifest
          path: .readiness
      - name: Open a pull request when the module/file set changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # Commit only the manifest
          add-paths: .readiness/publication.yaml
          branch: readiness/publication-manifest
          title: 'readiness: refresh publication manifest'
          commit-message: 'readiness: refresh publication manifest from the publisher sandbox'
          body: 'The module/file set produced by the publisher differs from .readiness/publication.yaml. Review the diff.'
