// ADRM dependency inventory (Gradle). Public API only. Registers `adrmDependencies` on every project: for every
// resolvable configuration whose name matches the adrm.configurations pattern (default: compileClasspath and
// runtimeClasspath of the main source set; test, integration or jmh classpaths multiply the graph several times
// without changing what ships, pass -Padrm.configurations=<regex> to include them) it walks
// incoming.resolutionResult, which reads POM and module metadata and downloads no artifacts, and writes
// build/adrm-dependencies.json. Failures are recorded per configuration and never thrown. Apply with --init-script
// (not init.d); run with --no-configuration-cache.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.api.publish.maven.MavenPublication

def defaultPattern = '^(compileClasspath|runtimeClasspath)$'

gradle.allprojects { Project project ->
  project.tasks.register('adrmDependencies') { task ->
    task.group = 'adrm'
    task.description = 'Writes the resolved dependency graph of the classpath configurations to build/adrm-dependencies.json'
    task.notCompatibleWithConfigurationCache('reads project configurations at execution time')
    task.doLast {
      def pattern = (project.findProperty('adrm.configurations') ?: defaultPattern).toString()
      def describe = { component ->
        def id = component.id
        def mv = component.moduleVersion
        def group = (mv?.group ?: (id instanceof ModuleComponentIdentifier ? id.group : project.group)).toString()
        def name = (mv?.name ?: (id instanceof ModuleComponentIdentifier ? id.module : id.displayName)).toString()
        def version = (mv?.version ?: (id instanceof ModuleComponentIdentifier ? id.version : project.version)).toString()
        [key: "${group}:${name}:${version}".toString(), group: group, name: name, version: version,
         project: id instanceof ProjectComponentIdentifier ? id.projectPath : null]
      }
      def configurations = []
      project.configurations.findAll { it.canBeResolved && it.name ==~ pattern }.sort { it.name }.each { conf ->
        def entry = [name: conf.name, root: null, components: [:], edges: [], unresolved: [], error: null]
        try {
          def result = conf.incoming.resolutionResult
          def root = describe(result.rootComponent.get())
          entry.root = root.key
          def seen = new HashSet()
          result.allDependencies.each { dep ->
            if (dep.constraint) return
            def from = describe(dep.from)
            def fromKey = from.key == root.key ? null : from.key
            if (fromKey != null) entry.components[from.key] = from.subMap(['group', 'name', 'version', 'project'])
            if (dep instanceof ResolvedDependencyResult) {
              def to = describe(dep.selected)
              entry.components[to.key] = to.subMap(['group', 'name', 'version', 'project'])
              if (seen.add("${fromKey}->${to.key}".toString())) entry.edges << [from: fromKey, to: to.key]
            } else if (dep instanceof UnresolvedDependencyResult) {
              entry.unresolved << [from: fromKey, attempted: dep.attempted.displayName, message: (dep.failure?.message ?: 'unresolved').toString().take(1024)]
            }
          }
        } catch (Exception e) {
          entry.error = "${e.class.simpleName}: ${e.message}".toString().take(2048)
        }
        entry.components = entry.components.sort()
        configurations << entry
      }
      def publications = []
      def publishing = project.extensions.findByName('publishing')
      if (publishing != null) {
        try {
          publishing.publications.withType(MavenPublication).each { p ->
            publications << [name: p.name, groupId: p.groupId, artifactId: p.artifactId, version: p.version]
          }
        } catch (Exception ignored) { }
      }
      def rel = project.rootDir.toPath().relativize(project.projectDir.toPath()).toString()
      def out = project.layout.buildDirectory.file('adrm-dependencies.json').get().asFile
      out.parentFile.mkdirs()
      out.text = JsonOutput.prettyPrint(JsonOutput.toJson([
        schema: 'adrm/gradle-dependencies/v1',
        gradleVersion: project.gradle.gradleVersion,
        project: [path: project.path, group: project.group.toString(), name: project.name, version: project.version.toString(), dir: rel.isEmpty() ? '.' : rel],
        publications: publications.sort { it.name },
        configurations: configurations,
      ]))
      println("ADRM dependencies: ${project.path} -> ${out} (${configurations.size()} configurations)")
    }
  }
}
